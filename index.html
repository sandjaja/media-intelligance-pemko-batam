<!doctype html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Intelligence Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{navy:{950:'#030611',900:'#070d1f',800:'#0b132b'},cyanx:'#22d3ee',goldx:'#f59e0b'}}}};</script>
<style>
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#030611}.glass{background:rgba(15,23,42,.78);backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,.14)}
select,input,button{outline:none}select{color:#e2e8f0;background:#0f172a!important;color-scheme:dark}select option{background:#0f172a;color:#f8fafc}.active{background:#0891b2!important;color:#fff!important;border-color:#22d3ee!important}
</style>
</head>
<body class="min-h-screen text-slate-100">
<header class="sticky top-0 z-50 glass border-b border-slate-800 px-4 lg:px-8 py-3">
<div class="max-w-[1600px] mx-auto flex flex-wrap gap-3 items-center justify-between">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-amber-400 grid place-items-center text-slate-950"><i class="fa-solid fa-radar"></i></div><div><h1 class="font-black tracking-wider">MEDIA INTELLIGENCE COMMAND CENTER</h1><p class="text-[10px] uppercase tracking-[.25em] text-slate-400">Scan · Detect · Understand · Highlight · Act</p></div></div>
<div class="flex flex-wrap items-center gap-2">
<label class="flex items-center gap-2 glass rounded-lg px-2 py-1.5 text-xs"><i class="fa-solid fa-building text-cyan-400"></i><span class="text-slate-400">OPD</span><select id="opdSelect" class="bg-transparent border-0 font-semibold min-w-[190px] cursor-pointer"><option value="all">Semua OPD / Pemko Batam</option><option>Dinas Komunikasi dan Informatika</option><option>Dinas Bina Marga dan Sumber Daya Air</option><option>DPMPTSP</option><option>Dinas Perhubungan</option><option>Dinas Kesehatan</option><option>Dinas Pendidikan</option></select></label>
<button id="modeBtn" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold"><i class="fa-solid fa-bolt text-amber-400 mr-1"></i> OVERPOWER</button>
<button id="exportBtn" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs"><i class="fa-solid fa-file-export text-cyan-400 mr-1"></i> Export</button>
</div></div></header>
<nav class="sticky top-[66px] z-40 bg-navy-900/95 border-b border-slate-800 px-4 py-2 overflow-x-auto"><div id="tabs" class="max-w-[1600px] mx-auto flex gap-2 min-w-max"></div></nav>
<main class="max-w-[1600px] mx-auto p-4 lg:p-7 space-y-5">
<section class="glass rounded-2xl p-4 border-l-4 border-amber-400 flex flex-wrap justify-between gap-3"><div><span class="text-[10px] font-black tracking-widest text-amber-400">LIVE MONITORING</span><p id="alertText" class="text-sm mt-1">Pantauan aktif untuk seluruh sumber media.</p></div><div class="text-xs text-slate-400 self-center">Last sync: <span id="clock"></span></div></section>
<section id="dashboard" class="space-y-5"></section>
<section id="highlights" class="hidden space-y-5"></section>
<section id="scan" class="hidden space-y-5"></section>
<section id="sowhat" class="hidden space-y-5"></section>
<section id="sources" class="hidden space-y-5"></section>
<section id="ask" class="hidden space-y-5"></section>
</main>
<div id="toast" class="fixed bottom-5 right-5 hidden glass rounded-xl px-4 py-3 text-xs shadow-2xl"></div>
<script>
const DATA={
 metrics:{articles:142,sources:38,score:84,critical:2},
 news:[
 {rank:1,title:'Investasi sektor manufaktur senilai Rp 2,4 T masuk Batam',media:'Batam Pos',type:'Cetak',sentiment:'Positif',score:94,tag:'Investasi',why:'Memperkuat positioning Batam sebagai tujuan investasi regional.',action:'Amplifikasi data investasi dan serapan tenaga kerja.'},
 {rank:2,title:'Warga keluhkan genangan air pasca hujan di Batam Center',media:'BatamNews.co.id',type:'Online',sentiment:'Negatif',score:88,tag:'Infrastruktur',why:'Berpotensi berkembang menjadi isu reputasi pelayanan publik.',action:'Verifikasi lapangan, lakukan penanganan dan publikasikan progres.'},
 {rank:3,title:'Batam dorong transformasi layanan publik berbasis digital',media:'Kompas.com',type:'Online',sentiment:'Positif',score:82,tag:'Digitalisasi',why:'Mendukung narasi pemerintahan adaptif dan pelayanan cepat.',action:'Siapkan case study dan data capaian layanan.'}
 ]
};
let state={tab:'dashboard',overpower:false,opd:'all'};
const tabs=[['dashboard','gauge-high','Dashboard Utama'],['highlights','fire','Daily News Highlights'],['scan','newspaper','Scan Media Cetak / OCR'],['sowhat','brain','So What? Engine'],['sources','list-check','Sumber & Media Tier'],['ask','comments','Ask Intelligence']];
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" class="tab px-3 py-2 rounded-lg border border-transparent text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-${t[1]} mr-2"></i>${t[2]}</button>`).join('')+(state.overpower?'<button data-tab="sowhat" class="tab px-3 py-2 rounded-lg border border-amber-500/40 text-amber-300 text-xs"><i class="fa-solid fa-microchip mr-2"></i>Deep Intelligence</button>':'');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));document.querySelector(`[data-tab="${state.tab}"]`)?.classList.add('active')}
function showTab(id){state.tab=id;document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');renderTabs();if(id==='dashboard')drawChart()}
function card(title,value,sub,icon){return `<div class="glass rounded-xl p-4"><div class="flex justify-between"><div><p class="text-xs text-slate-400">${title}</p><h3 class="text-2xl font-black mt-1">${value}</h3></div><i class="fa-solid fa-${icon} text-cyan-400 text-lg"></i></div><p class="text-[11px] text-slate-400 mt-3">${sub}</p></div>`}
function renderDashboard(){document.getElementById('dashboard').innerHTML=`<div class="glass rounded-2xl p-5"><div class="flex flex-wrap justify-between gap-3"><div><span class="text-[10px] text-cyan-400 font-black tracking-widest">EXECUTIVE BRIEF</span><h2 class="text-xl font-bold mt-1">Media Intelligence Executive Summary</h2><p class="text-xs text-slate-400 mt-1">${state.opd==='all'?'Seluruh Pemko Batam':esc(state.opd)}</p></div><div class="text-right"><span class="text-xs text-slate-400">Overall sentiment</span><div class="text-emerald-400 font-black">62% Positif · 24% Negatif</div></div></div><div class="grid md:grid-cols-5 gap-3 mt-5">${[['WHAT HAPPENED','Investasi manufaktur menjadi narasi utama.','cyan'],['WHY IT MATTERS','Mendorong trust investor dan reputasi daerah.','amber'],['PUBLIC SAYING','Apresiasi investasi, kritik infrastruktur.','purple'],['RISK','Isu genangan dapat menggeser narasi positif.','rose'],['WHAT SHOULD WE DO','Respons teknis cepat + amplifikasi data.','emerald']].map(x=>`<div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800"><b class="text-${x[2]}-400 text-[10px]">${x[0]}</b><p class="text-xs text-slate-300 mt-1 leading-relaxed">${x[1]}</p></div>`).join('')}</div></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${card('Total Berita Diproses',DATA.metrics.articles+' artikel','+18% dibanding kemarin','newspaper')}${card('Sumber Media',DATA.metrics.sources+' outlet','12 cetak · 26 online','globe')}${card('Media Momentum',DATA.metrics.score+'/100','High velocity & engagement','gauge-high')}${card('Critical Issues',DATA.metrics.critical,'Perlu atensi segera','triangle-exclamation')}</div><div class="grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2 glass rounded-2xl p-5"><h3 class="font-bold text-sm">Media Sentiment Trend</h3><p class="text-xs text-slate-400 mb-3">7 hari terakhir</p><div class="h-64"><canvas id="trend"></canvas></div></div><div class="glass rounded-2xl p-5"><h3 class="font-bold text-sm">Priority Queue</h3><div class="space-y-3 mt-4">${DATA.news.map(n=>`<div class="border-b border-slate-800 pb-3"><div class="flex justify-between text-[10px]"><span class="text-slate-400">#${n.rank} · ${n.media}</span><b class="${n.sentiment==='Negatif'?'text-rose-400':'text-emerald-400'}">${n.score}</b></div><p class="text-xs mt-1">${n.title}</p></div>`).join('')}</div></div></div>`}
function drawChart(){setTimeout(()=>{const c=document.getElementById('trend');if(!c)return;if(window._chart)window._chart.destroy();window._chart=new Chart(c,{type:'line',data:{labels:['Sen','Sel','Rab','Kam','Jum','Sab','Min'],datasets:[{label:'Positif',data:[45,52,60,58,65,62,70],borderColor:'#22d3ee',tension:.35},{label:'Negatif',data:[30,25,20,28,22,24,18],borderColor:'#fb7185',tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}}},scales:{x:{ticks:{color:'#64748b'},grid:{color:'#1e293b'}},y:{ticks:{color:'#64748b'},grid:{color:'#1e293b'}}}}})},20)}
function renderHighlights(){document.getElementById('highlights').innerHTML=`<div><h2 class="text-xl font-bold"><i class="fa-solid fa-fire text-amber-400 mr-2"></i>Daily News Highlights</h2><p class="text-xs text-slate-400">Top news berdasarkan importance, impact, sentiment dan velocity.</p></div>${DATA.news.map(n=>`<article class="glass rounded-2xl p-5 border ${n.sentiment==='Negatif'?'border-rose-500/30':'border-slate-800'}"><div class="flex flex-wrap justify-between gap-2"><div class="text-xs text-slate-400">RANK #${n.rank} · ${n.type} · ${n.media}</div><b class="px-2 py-1 rounded bg-cyan-500/10 text-cyan-300">${n.score}/100</b></div><h3 class="font-bold text-lg mt-3">${n.title}</h3><div class="grid md:grid-cols-3 gap-3 mt-4 text-xs"><div class="bg-slate-900/70 p-3 rounded-xl"><b class="text-amber-400">WHY IT MATTERS</b><p class="mt-1 text-slate-300">${n.why}</p></div><div class="bg-slate-900/70 p-3 rounded-xl"><b class="text-cyan-400">SENTIMENT</b><p class="mt-1 ${n.sentiment==='Negatif'?'text-rose-400':'text-emerald-400'} font-bold">${n.sentiment}</p></div><div class="bg-slate-900/70 p-3 rounded-xl"><b class="text-purple-400">RECOMMENDED ACTION</b><p class="mt-1 text-slate-300">${n.action}</p></div></div></article>`).join('')}`}
function renderScan(){document.getElementById('scan').innerHTML=`<div class="glass rounded-2xl p-5"><h2 class="text-xl font-bold"><i class="fa-solid fa-newspaper text-emerald-400 mr-2"></i>Scan Media Cetak / OCR</h2><p class="text-xs text-slate-400 mt-1">Upload kliping untuk dianalisis. Versi ini menyiapkan alur UI; engine OCR/API dapat disambungkan di backend.</p><div class="grid lg:grid-cols-2 gap-5 mt-5"><label class="border-2 border-dashed border-slate-700 hover:border-cyan-400 rounded-2xl p-10 text-center cursor-pointer"><input id="fileInput" type="file" accept="image/*,.pdf" class="hidden"><i class="fa-solid fa-cloud-arrow-up text-3xl text-cyan-400"></i><p class="font-bold mt-2">Pilih PDF / JPG / PNG</p><p class="text-[11px] text-slate-500">Maks. 25 MB</p></label><div id="ocrBox" class="bg-slate-950 rounded-2xl p-4 border border-slate-800 text-xs text-slate-300">Belum ada berkas. Setelah backend OCR aktif, hasil akan muncul di sini: headline, full text, entities, sentiment, importance score dan rekomendasi.</div></div></div>`;document.getElementById('fileInput').onchange=e=>{const f=e.target.files[0];if(f){document.getElementById('ocrBox').innerHTML=`<b class="text-emerald-400">BERKAS SIAP DIPROSES</b><p class="mt-2">${esc(f.name)}</p><p class="text-slate-500">${(f.size/1024/1024).toFixed(2)} MB · ${esc(f.type||'unknown')}</p><button onclick="toast('OCR engine backend belum terhubung')" class="mt-4 px-3 py-2 rounded-lg bg-emerald-500 text-slate-950 font-bold">Jalankan OCR & AI</button>`}}}
function renderSoWhat(){document.getElementById('sowhat').innerHTML=`<div class="glass rounded-2xl p-5"><h2 class="text-xl font-bold"><i class="fa-solid fa-brain text-purple-400 mr-2"></i>So What? Intelligence Engine</h2><p class="text-xs text-slate-400">Mengubah berita menjadi keputusan komunikasi.</p><div class="grid md:grid-cols-5 gap-3 mt-5">${['What happened','Why it matters','What it means','What could happen next','What should we do'].map((x,i)=>`<div class="bg-slate-900/80 rounded-xl p-4 border border-slate-800"><b class="text-[10px] text-cyan-400 uppercase">${x}</b><p class="text-xs mt-2 text-slate-300">${['Isu investasi dan genangan mendominasi pantauan.','Reputasi layanan publik dapat memengaruhi narasi investasi.','Publik menilai hasil pembangunan dari dampak langsung.','Isu infrastruktur berpotensi naik jika tidak ada respons.','Prioritaskan verifikasi lapangan, respons teknis, dan amplifikasi data.'][i]}</p></div>`).join('')}</div></div>${state.overpower?`<div class="glass rounded-2xl p-5 border border-amber-500/30"><h3 class="font-bold text-amber-400">⚡ Deep Intelligence / Overpower</h3><div class="grid md:grid-cols-3 gap-3 mt-4 text-xs"><div class="bg-slate-900 p-4 rounded-xl"><b class="text-amber-400">HIDDEN STORY</b><p class="mt-1">Topik akses modal UMKM mulai muncul di percakapan lokal.</p></div><div class="bg-slate-900 p-4 rounded-xl"><b class="text-amber-400">NARRATIVE SHIFT</b><p class="mt-1">Narasi bergeser dari pembangunan fisik ke kualitas daya dukung.</p></div><div class="bg-slate-900 p-4 rounded-xl"><b class="text-amber-400">EARLY WARNING</b><p class="mt-1">Pantau eskalasi isu drainase selama 24 jam berikutnya.</p></div></div></div>`:''}`}
function renderSources(){document.getElementById('sources').innerHTML=`<div class="glass rounded-2xl p-5"><h2 class="text-xl font-bold">Media Source & Tier Management</h2><p class="text-xs text-slate-400">Sumber contoh yang siap diganti dengan database.</p><div class="overflow-x-auto mt-4"><table class="w-full text-xs"><thead class="text-slate-400 bg-slate-900"><tr>${['Media','Kategori','Tier','Influence','Status'].map(x=>`<th class="p-3 text-left">${x}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-800">${[['Batam Pos','Cetak / E-Paper','Tier 1','High','Active'],['Kompas.com','Online','Tier 1','Very High','Active'],['BatamNews.co.id','Online','Tier 2','Medium High','Active']].map(r=>`<tr>${r.map((x,i)=>`<td class="p-3 ${i===0?'font-bold':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function renderAsk(){document.getElementById('ask').innerHTML=`<div class="glass rounded-2xl p-5"><h2 class="text-xl font-bold"><i class="fa-solid fa-comments text-cyan-400 mr-2"></i>Ask Media Intelligence</h2><div id="chat" class="h-72 overflow-y-auto bg-slate-950 rounded-xl p-4 mt-4 text-xs space-y-3"><div class="bg-slate-900 rounded-lg p-3 max-w-2xl"><b class="text-cyan-400">AI Intelligence</b><p class="mt-1">Siap menganalisis berita, isu, risiko, sentimen dan rekomendasi komunikasi.</p></div></div><div class="flex gap-2 mt-3"><input id="q" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs" placeholder="Contoh: isu negatif paling berisiko hari ini?"><button id="askBtn" class="bg-cyan-500 text-slate-950 font-bold px-5 rounded-xl">Kirim</button></div></div>`;document.getElementById('askBtn').onclick=()=>{const q=document.getElementById('q');if(!q.value.trim())return;const c=document.getElementById('chat');c.innerHTML+=`<div class="bg-slate-800 rounded-lg p-3 ml-auto max-w-2xl">${esc(q.value)}</div><div class="bg-slate-900 rounded-lg p-3 max-w-2xl"><b class="text-cyan-400">AI Intelligence</b><p class="mt-1">Untuk pertanyaan <b>${esc(q.value)}</b>, prioritas saat ini adalah memvalidasi isu negatif, mengukur velocity, lalu menyiapkan respons berbasis data. Hubungkan endpoint AI backend untuk analisis live.</p></div>`;q.value='';c.scrollTop=c.scrollHeight}}
renderDashboard();renderHighlights();renderScan();renderSoWhat();renderSources();renderAsk();renderTabs();drawChart();
document.getElementById('opdSelect').onchange=e=>{state.opd=e.target.value;renderDashboard();showTab('dashboard');toast('Dashboard difilter: '+e.target.options[e.target.selectedIndex].text)};
document.getElementById('modeBtn').onclick=()=>{state.overpower=!state.overpower;document.getElementById('modeBtn').classList.toggle('active',state.overpower);renderSoWhat();renderTabs();toast(state.overpower?'Overpower Intelligence aktif':'Overpower Intelligence dimatikan')};
document.getElementById('exportBtn').onclick=()=>toast('Export API belum terhubung. Backend report generator siap ditambahkan.');
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('id-ID'),1000);document.getElementById('clock').textContent=new Date().toLocaleTimeString('id-ID');
</script></body></html>
