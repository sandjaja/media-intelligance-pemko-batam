<!doctype html>
<html lang="id" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Intelligence - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-slate-100 px-4">
  <main class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-500 to-purple-500 flex items-center justify-center mx-auto mb-4 shadow-xl">
        <i class="fa-solid fa-radar text-white text-2xl"></i>
      </div>
      <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">Media Intelligence</h1>
      <p class="text-sm text-slate-400 mt-2">Sistem Monitoring Media Pemko Batam</p>
    </div>

    <section class="bg-slate-900/90 border border-slate-700/60 rounded-2xl p-8 shadow-2xl backdrop-blur">
      <h2 class="text-xl font-bold">Selamat Datang</h2>
      <p class="text-sm text-slate-400 mt-1 mb-6">Masukkan kredensial untuk mengakses Command Center.</p>

      <form id="loginForm" class="space-y-4">
        <label class="block">
          <span class="block text-sm font-semibold text-slate-300 mb-2">Email</span>
          <input id="username" type="email" autocomplete="username" required class="w-full bg-slate-950 border border-slate-700 rounded-lg py-3 px-4 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20" placeholder="admin@pemkobatam.go.id">
        </label>

        <label class="block">
          <span class="block text-sm font-semibold text-slate-300 mb-2">Kata Sandi</span>
          <div class="relative">
            <input id="password" type="password" autocomplete="current-password" minlength="8" required class="w-full bg-slate-950 border border-slate-700 rounded-lg py-3 px-4 pr-12 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20" placeholder="••••••••">
            <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-200" aria-label="Tampilkan password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </label>

        <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300"></div>

        <button id="loginBtn" type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-purple-500 hover:from-cyan-600 hover:to-purple-600 text-white font-bold py-3 rounded-lg transition disabled:opacity-60">
          <i class="fa-solid fa-right-to-bracket mr-2"></i>Masuk ke Sistem
        </button>
      </form>

      <p class="text-center text-xs text-slate-500 mt-6">Session diamankan menggunakan HttpOnly cookie.</p>
    </section>
  </main>

  <script>
    (() => {
      const API = (window.MEDIA_INTELLIGENCE_API || '/api').replace(/\/$/, '');
      const form = document.getElementById('loginForm');
      const btn = document.getElementById('loginBtn');
      const error = document.getElementById('errorMessage');
      const password = document.getElementById('password');
      const toggle = document.getElementById('togglePassword');

      toggle.addEventListener('click', () => {
        const visible = password.type === 'text';
        password.type = visible ? 'password' : 'text';
        toggle.innerHTML = visible ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
      });

      // If the server already has a valid session, skip the login page.
      fetch(API + '/me', { credentials: 'include', cache: 'no-store' })
        .then(async r => {
          if (r.ok) window.location.replace('dashboard.html');
        })
        .catch(() => {});

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Memproses...';

        try {
          const response = await fetch(API + '/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              email: document.getElementById('username').value.trim(),
              password: password.value
            })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
          window.location.replace('dashboard.html');
        } catch (err) {
          error.textContent = err.message === 'INVALID_CREDENTIALS' ? 'Email atau password salah.' : `Login gagal: ${err.message}`;
          error.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i>Masuk ke Sistem';
        }
      });
    })();
  </script>
</body>
</html>
