<!doctype html>
<html lang="id" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Intelligence - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .glass {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .gradient-text {
      background: linear-gradient(to right, #06b6d4, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center text-slate-100">
  <!-- Main Container -->
  <div class="w-full max-w-md px-4">
    <!-- Logo & Branding -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-lg bg-gradient-to-br from-cyan-500 to-purple-500 flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-radar text-white text-2xl"></i>
      </div>
      <h1 class="text-3xl font-black gradient-text mb-2">Media Intelligence</h1>
      <p class="text-sm text-slate-400">Sistem Monitoring Media Sosial Pemko Batam</p>
    </div>

    <!-- Login Card -->
    <div class="glass border border-slate-700/50 rounded-2xl p-8 space-y-6">
      <!-- Header -->
      <div>
        <h2 class="text-xl font-bold text-white mb-2">Selamat Datang</h2>
        <p class="text-sm text-slate-400">Masukkan kredensial Anda untuk melanjutkan</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4">
        <!-- Username/Email Field -->
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-2">Username atau Email</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input 
              type="text" 
              id="username" 
              placeholder="admin@pemkobatam.go.id"
              class="w-full bg-slate-900/50 border border-slate-700 rounded-lg py-3 pl-12 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition"
              required
            >
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-2">Kata Sandi</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input 
              type="password" 
              id="password" 
              placeholder="••••••••"
              class="w-full bg-slate-900/50 border border-slate-700 rounded-lg py-3 pl-12 pr-12 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition"
              required
            >
            <button 
              type="button"
              id="togglePassword"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me -->
        <label class="flex items-center gap-2 cursor-pointer">
          <input 
            type="checkbox" 
            id="remember"
            class="w-4 h-4 rounded bg-slate-900 border border-slate-700 accent-cyan-500 cursor-pointer"
          >
          <span class="text-sm text-slate-400">Ingat saya di perangkat ini</span>
        </label>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/50 rounded-lg p-3">
          <p class="text-sm text-red-300 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorText"></span>
          </p>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit"
          id="loginBtn"
          class="w-full bg-gradient-to-r from-cyan-500 to-purple-500 hover:from-cyan-600 hover:to-purple-600 text-white font-bold py-3 rounded-lg transition transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-sign-in-alt"></i>
          Masuk ke Sistem
        </button>
      </form>

      <!-- Divider -->
      <div class="relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-700/50"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-slate-950 text-slate-500">atau</span>
        </div>
      </div>

      <!-- Demo Access -->
      <button 
        type="button"
        id="demoBtn"
        class="w-full border border-slate-700 hover:border-slate-500 text-slate-300 hover:text-slate-100 font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2"
      >
        <i class="fa-solid fa-play-circle"></i>
        Akses Demo
      </button>
    </div>

    <!-- Footer -->
    <div class="text-center mt-6 text-xs text-slate-500">
      <p>© 2024 Media Intelligence - Pemerintah Kota Batam</p>
      <p class="mt-2">
        <a href="#" class="hover:text-slate-300 transition">Kebijakan Privasi</a> • 
        <a href="#" class="hover:text-slate-300 transition">Syarat Layanan</a> • 
        <a href="#" class="hover:text-slate-300 transition">Hubungi Kami</a>
      </p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="auth-ui.js"></script>
  <script>
    // Password toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const passwordIcon = togglePassword.querySelector('i');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      passwordIcon.classList.toggle('fa-eye');
      passwordIcon.classList.toggle('fa-eye-slash');
    });

    // Login form handler
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const demoBtn = document.getElementById('demoBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.add('hidden');
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      // Show loading state
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Memproses...';

      try {
        // Simulate API call - replace with actual authentication
        await new Promise(resolve => setTimeout(resolve, 1000));

        if (username && password) {
          // Store session
          localStorage.setItem('isAuthenticated', 'true');
          localStorage.setItem('username', username);
          if (remember) {
            localStorage.setItem('rememberMe', 'true');
          }

          // Redirect to dashboard
          window.location.href = 'dashboard.html';
        } else {
          throw new Error('Username dan password harus diisi');
        }
      } catch (error) {
        errorText.textContent = error.message || 'Login gagal. Silakan coba lagi.';
        errorMessage.classList.remove('hidden');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-sign-in-alt"></i> Masuk ke Sistem';
      }
    });

    // Demo access
    demoBtn.addEventListener('click', () => {
      localStorage.setItem('isAuthenticated', 'true');
      localStorage.setItem('username', 'Demo User');
      window.location.href = 'dashboard.html';
    });

    // Check if already logged in
    if (localStorage.getItem('isAuthenticated') === 'true') {
      window.location.href = 'dashboard.html';
    }

    // Pre-fill remembered email
    const rememberMe = localStorage.getItem('rememberMe');
    const savedUsername = localStorage.getItem('username');
    if (rememberMe === 'true' && savedUsername) {
      document.getElementById('username').value = savedUsername;
      document.getElementById('remember').checked = true;
    }
  </script>
</body>
</html>
