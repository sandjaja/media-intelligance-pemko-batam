# Replace mediaintelligence.example with the real domain. This is the only public root.
server {
    listen 80;
    server_name mediaintelligence.example;
    root /opt/media-intelligence/public;
    index index.html;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ /\. { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exactly one trusted hop: overwrite user-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        add_header Cache-Control no-store always;
    }
    # Keep installer scripts/styles on the backend ahead of static-file regexes.
    location ^~ /install {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 360s;
        add_header Cache-Control no-store always;
    }
    location = /health { proxy_pass http://127.0.0.1:8080; }
    location = /ready { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8080; }
    location = / { add_header Cache-Control no-store always; try_files /index.html =404; }
    location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location / { try_files $uri =404; }
}
