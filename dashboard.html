<!doctype html>
<html lang="id" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Intelligence Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .tab.active {
      @apply bg-slate-700 text-white;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .sidebar {
      transition: all 0.3s ease;
    }
    .sidebar.hidden {
      transform: translateX(-100%);
    }
  </style>
</head>
<body class="text-slate-100">
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 bg-slate-950/95 border-b border-slate-700/50 backdrop-blur z-40">
    <div class="px-6 py-4 flex items-center justify-between">
      <!-- Left: Logo & Menu Toggle -->
      <div class="flex items-center gap-4">
        <button id="menuToggle" class="md:hidden p-2 hover:bg-slate-800 rounded-lg transition">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-purple-500 flex items-center justify-center">
            <i class="fa-solid fa-radar text-white"></i>
          </div>
          <div>
            <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">Media Intelligence</h1>
            <p class="text-xs text-slate-500">Command Center - Pemko Batam</p>
          </div>
        </div>
      </div>

      <!-- Right: User Menu -->
      <div class="flex items-center gap-4">
        <div class="hidden md:flex items-center gap-3 px-4 py-2 bg-slate-900/50 rounded-lg">
          <i class="fa-solid fa-user-circle text-cyan-400"></i>
          <div>
            <p id="displayUsername" class="text-sm font-semibold">User</p>
            <p class="text-xs text-slate-500">Administrator</p>
          </div>
        </div>
        <button id="logoutBtn" class="p-2 hover:bg-slate-800 rounded-lg transition" title="Logout">
          <i class="fa-solid fa-sign-out-alt text-xl"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar Navigation -->
  <aside id="sidebar" class="sidebar fixed left-0 top-16 bottom-0 w-64 bg-slate-900/50 border-r border-slate-700/50 overflow-y-auto z-30 md:translate-x-0">
    <nav class="p-4 space-y-2">
      <!-- Navigation Items -->
      <button class="nav-item w-full px-4 py-3 rounded-lg hover:bg-slate-800 transition flex items-center gap-3 text-left group" data-tab="dashboard">
        <i class="fa-solid fa-chart-line text-cyan-400 group-hover:text-cyan-300"></i>
        <span class="font-semibold">Dashboard</span>
      </button>

      <button class="nav-item w-full px-4 py-3 rounded-lg hover:bg-slate-800 transition flex items-center gap-3 text-left group" data-tab="scan">
        <i class="fa-solid fa-radar text-purple-400 group-hover:text-purple-300"></i>
        <span class="font-semibold">Media Scan</span>
      </button>

      <button class="nav-item w-full px-4 py-3 rounded-lg hover:bg-slate-800 transition flex items-center gap-3 text-left group" data-tab="highlights">
        <i class="fa-solid fa-star text-yellow-400 group-hover:text-yellow-300"></i>
        <span class="font-semibold">Highlights</span>
      </button>

      <button class="nav-item w-full px-4 py-3 rounded-lg hover:bg-slate-800 transition flex items-center gap-3 text-left group" data-tab="sowhat">
        <i class="fa-solid fa-lightbulb text-orange-400 group-hover:text-orange-300"></i>
        <span class="font-semibold">So What Engine</span>
      </button>

      <button class="nav-item w-full px-4 py-3 rounded-lg hover:bg-slate-800 transition flex items-center gap-3 text-left group" data-tab="sources">
        <i class="fa-solid fa-link text-blue-400 group-hover:text-blue-300"></i>
        <span class="font-semibold">Sources</span>
      </button>

      <button class="nav-item w-full px-4 py-3 rounded-lg hover:bg-slate-800 transition flex items-center gap-3 text-left group" data-tab="alerts">
        <i class="fa-solid fa-bell text-red-400 group-hover:text-red-300"></i>
        <span class="font-semibold">Alerts</span>
      </button>

      <button class="nav-item w-full px-4 py-3 rounded-lg hover:bg-slate-800 transition flex items-center gap-3 text-left group" data-tab="ask">
        <i class="fa-solid fa-comments text-green-400 group-hover:text-green-300"></i>
        <span class="font-semibold">Ask AI</span>
      </button>

      <!-- Divider -->
      <div class="my-4 border-t border-slate-700/50"></div>

      <!-- Settings -->
      <button class="w-full px-4 py-3 rounded-lg hover:bg-slate-800 transition flex items-center gap-3 text-left group">
        <i class="fa-solid fa-cog text-slate-400 group-hover:text-slate-300"></i>
        <span class="font-semibold">Pengaturan</span>
      </button>

      <button class="w-full px-4 py-3 rounded-lg hover:bg-slate-800 transition flex items-center gap-3 text-left group">
        <i class="fa-solid fa-question-circle text-slate-400 group-hover:text-slate-300"></i>
        <span class="font-semibold">Bantuan</span>
      </button>
    </nav>
  </aside>

  <!-- Overlay for mobile -->
  <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/50 z-20 md:hidden"></div>

  <!-- Main Content -->
  <main class="md:ml-64 mt-20 mb-8 px-4 md:px-8">
    <!-- Top Controls -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
      <div class="flex items-center gap-4">
        <label class="text-sm font-semibold text-slate-300">Filter OPD:</label>
        <select id="opdSelect" class="px-4 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-cyan-500">
          <option value="all">Semua OPD</option>
        </select>
      </div>
      <div class="flex gap-2">
        <button id="modeBtn" class="px-4 py-2 rounded-lg border border-slate-700 hover:border-slate-500 text-slate-400 hover:text-slate-200 text-sm font-semibold">
          <i class="fa-solid fa-rocket mr-2"></i>Power Mode
        </button>
        <button id="runIngestion" class="px-4 py-2 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-500/30 text-sm font-semibold">
          <i class="fa-solid fa-play mr-1"></i>Run Ingestion
        </button>
      </div>
    </div>

    <!-- Tabs Navigation -->
    <nav id="tabs" class="flex gap-2 mb-6 overflow-x-auto pb-2 border-b border-slate-700/30"></nav>

    <!-- Tab Content Sections -->
    <div id="dashboard" class="hidden"></div>
    <div id="highlights" class="hidden"></div>
    <div id="scan" class="hidden"></div>
    <div id="sowhat" class="hidden"></div>
    <div id="sources" class="hidden"></div>
    <div id="alerts" class="hidden"></div>
    <div id="ask" class="hidden"></div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed top-24 right-4 bg-slate-950 border border-slate-700 text-white px-4 py-3 rounded-lg shadow-lg z-50"></div>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script src="sowhat-engine.js"></script>
  <script>
    // Auth Check
    if (localStorage.getItem('isAuthenticated') !== 'true') {
      window.location.href = 'login.html';
    }

    // Display username
    const username = localStorage.getItem('username') || 'User';
    document.getElementById('displayUsername').textContent = username;

    // Sidebar Toggle
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('hidden');
      sidebarOverlay.classList.toggle('hidden');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.add('hidden');
      sidebarOverlay.classList.add('hidden');
    });

    // Close sidebar on nav item click (mobile)
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        if (window.innerWidth < 768) {
          sidebar.classList.add('hidden');
          sidebarOverlay.classList.add('hidden');
        }
      });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('isAuthenticated');
      localStorage.removeItem('username');
      localStorage.removeItem('rememberMe');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
