name: Apify Ledger Preview Concurrency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: apify-ledger-preview
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Preview database secret exists
        env:
          PREVIEW_DB: ${{ secrets.APIFY_LEDGER_TEST_DATABASE_URL }}
          PREVIEW_HOST: ${{ vars.APIFY_LEDGER_TEST_EXPECTED_HOST }}
        run: |
          if [ -z "$PREVIEW_DB" ] || [ -z "$PREVIEW_HOST" ]; then
            echo "::error::Missing Preview database URL or expected Neon host in apify-ledger-preview environment"
            exit 1
          fi
      # This repository has no committed package-lock.json; npm ci cannot run.
      - run: npm install --no-audit --no-fund
      - name: Run concurrent reservation test (Preview only)
        env:
          APIFY_LEDGER_TEST_DATABASE_URL: ${{ secrets.APIFY_LEDGER_TEST_DATABASE_URL }}
          APIFY_LEDGER_TEST_PREVIEW: 'true'
          APIFY_LEDGER_TEST_EXPECTED_HOST: ${{ vars.APIFY_LEDGER_TEST_EXPECTED_HOST }}
        run: npm run test:apify-ledger-preview
